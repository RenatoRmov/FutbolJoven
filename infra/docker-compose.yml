services:
  postgres:
    image: postgres:16-alpine
    container_name: futboljoven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futboljoven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futboljoven_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-futboljoven}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - futboljoven_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futboljoven}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  futboljoven_postgres_data:
